version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: selfgpt_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: selfgpt_litellm
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    restart: unless-stopped
    env_file: .env

  langfuse_db:
    image: postgres:15-alpine
    container_name: selfgpt_langfuse_db
    environment:
      - POSTGRES_USER=langfuse
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=langfuse
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  langfuse:
    image: langfuse/langfuse:2
    container_name: selfgpt_langfuse
    ports:
      - "3100:3000"
    depends_on:
      - langfuse_db
    environment:
      - DATABASE_URL=postgresql://langfuse:secret@langfuse_db:5432/langfuse
      - NEXTAUTH_SECRET=local-secret-change-later
      - SALT=local-salt-change-later
      - NEXTAUTH_URL=http://localhost:3100
      - TELEMETRY_ENABLED=false
    restart: unless-stopped

volumes:
  qdrant_data:
  langfuse_db_data:
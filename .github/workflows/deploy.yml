name: Build & Push

on:
  push:
    branches: [master]

env:
  REGISTRY: ghcr.io
  REPO: juniorraja

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: ghcr.io/${{ env.REPO }}/megpt-api:latest

      - name: Build & push UI
        uses: docker/build-push-action@v5
        with:
          context: ./ui
          push: true
          tags: ghcr.io/${{ env.REPO }}/megpt-ui:latest
          build-args: |
            NEXT_PUBLIC_API_URL=https://ai.prasannar.com/api

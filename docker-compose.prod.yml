services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: megpt_qdrant
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: megpt_litellm
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    restart: unless-stopped
    env_file: .env

  api:
    image: ghcr.io/juniorraja/megpt-api:latest
    container_name: megpt_api
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy
      litellm:
        condition: service_started
    env_file: .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - LITELLM_URL=http://litellm:4000
    restart: unless-stopped

  ui:
    image: ghcr.io/juniorraja/megpt-ui:latest
    container_name: megpt_ui
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  qdrant_data:
